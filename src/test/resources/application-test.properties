# This file is used ONLY when a test runs with the "test" profile.
# It overrides the matching settings from the main application.properties.

# Point to the separate TEST database (same Docker container, different database).
spring.datasource.url=jdbc:postgresql://localhost:5433/ticketdb_test
spring.datasource.username=postgres
spring.datasource.password=postgres

# create-drop = create fresh tables when the test starts, delete them when it ends.
# Every test run starts from a clean database.
spring.jpa.hibernate.ddl-auto=create-drop

# Keep the test console clean (no SQL printing).
spring.jpa.show-sql=false